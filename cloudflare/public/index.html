<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axium Video Downloader</title><style>body{margin:0;background:#080d16;color:#eef5ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(760px,90vw)}h1{font-size:clamp(42px,8vw,72px);line-height:1;margin:0 0 14px}em{color:#57e3db;font-style:normal}p{color:#9aaac0}form{display:flex;gap:10px;background:#121d2c;padding:16px;border:1px solid #304258;border-radius:12px}input{flex:1;min-width:0;background:#08111e;color:white;border:1px solid #304258;padding:14px;border-radius:8px}button{background:#57e3db;border:0;border-radius:8px;padding:12px 18px;font-weight:800}#status{margin-top:20px}</style></head><body><main class="wrap"><p>AXIUM CYBER / MEDIA TOOLS</p><h1>Save media.<br><em>Stay in control.</em></h1><p>Direct media downloads for content you own or are authorized to save. DRM and access-control circumvention are not supported.</p><form id="f"><input id="url" type="url" required placeholder="https://example.com/video.mp4"><button>Start</button></form><div id="status"></div><script>document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const s=document.querySelector("#status");s.textContent="Submitting…";try{const r=await fetch("/api/jobs",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url:document.querySelector("#url").value})});const d=await r.json();if(!r.ok)throw Error(d.error);s.textContent="Queued: "+d.id+" — refresh to check status.";}catch(x){s.textContent=x.message}};</script></main></body></html>

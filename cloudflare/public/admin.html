<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axium Downloader Admin</title><style>body{margin:0;background:#080d16;color:#eef5ff;font:15px system-ui;padding:30px}main{max-width:900px;margin:auto}h1{color:#57e3db}input{background:#111d2c;color:white;border:1px solid #345;padding:12px;border-radius:7px;width:min(500px,90%)}button{background:#57e3db;border:0;border-radius:7px;padding:12px 18px;font-weight:800;cursor:pointer}.row{padding:12px;border:1px solid #304258;border-radius:8px;margin:9px 0;overflow-wrap:anywhere}.muted{color:#9aaac0}</style></head><body><main><p class="muted">AXIUM CYBER / ADMIN</p><h1>Downloader operations</h1><p>Enter the Worker ADMIN_API_KEY secret. It is held only in this browser tab's session storage.</p><input id="key" type="password" placeholder="Admin API key"><button id="load">Load dashboard</button><button id="clear">Clear key</button><div id="stats"></div><h2>Recent tasks</h2><div id="jobs"></div></main><script>
const $=s=>document.querySelector(s);$("#key").value=sessionStorage.getItem("axium_admin_key")||"";$("#clear").onclick=()=>{sessionStorage.removeItem("axium_admin_key");$("#key").value="";$("#stats").textContent="Key cleared."};$("#load").onclick=async()=>{const k=$("#key").value;$("#stats").textContent="Loading…";try{const r=await fetch("/api/admin/overview",{headers:{"x-admin-key":k}});const d=await r.json();if(!r.ok)throw Error(d.error);sessionStorage.setItem("axium_admin_key",k);$("#stats").textContent="Total tasks: "+d.total+" · "+(d.stats||[]).map(x=>x.status+": "+x.count).join(" · ");$("#jobs").replaceChildren();for(const j of d.jobs||[]){const el=document.createElement("div");el.className="row";el.textContent=j.filename+" — "+j.status+(j.error?" — "+j.error:"");$("#jobs").append(el)}}catch(e){$("#stats").textContent=e.message}};if($("#key").value)$("#load").click();
</script></body></html>
